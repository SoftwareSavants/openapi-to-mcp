name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npx tsc --noEmit

      # Smoke test: generate from Petstore spec and verify it compiles
      - name: Smoke test
        run: |
          npx tsx src/index.ts https://petstore3.swagger.io/api/v3/openapi.json -o /tmp/petstore-test --force
          cd /tmp/petstore-test
          npm install
          npx tsc --noEmit

      - name: Xquik fixture smoke test
        run: |
          npx tsx src/index.ts test/fixtures/xquik-read-api.openapi.json --output=/tmp/xquik-test --name=xquik-read-api --include=/api/v1/x/tweets/search --force
          cd /tmp/xquik-test
          npm install
          npx tsc --noEmit
